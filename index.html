<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dipam's Notebook</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..900;1,300..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        populatePosts();
      });

      const pdfSvg = `<svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg><span>pdf</span>`;

      async function populatePosts() {
        const posts = await fetch("pages.json").then((res) => res.json());
        posts.reverse();
        const postsDiv = document.querySelector(".posts");
        const fmt = new Intl.DateTimeFormat("en-US", {
          // dateStyle: "long",
          day: "numeric",
          month: "short",
          year: "numeric",
        });

        for (const post of posts) {
          if (post.hidden) continue;
          const postDiv = document.createElement("div");
          postDiv.classList.add("post");

          const infoDiv = document.createElement("div");
          infoDiv.classList.add("info");

          const detailsDiv = document.createElement("div");
          detailsDiv.classList.add("details");

          const h2 = document.createElement("h2");
          const a = document.createElement("a");
          a.href = `page/${post.path}.html`;
          if (post.pdf && post.html === false) {
            a.href = `page/${post.path}.pdf`;
          }
          a.textContent = post.title;
          h2.appendChild(a);

          if (post.pdf && !("html" in post)) {
            const pdfA = document.createElement("a");
            pdfA.href = `page/${post.path}.pdf`;
            pdfA.classList.add("pdf");
            pdfA.innerHTML = pdfSvg;
            h2.appendChild(pdfA);
          }

          const dateDiv = document.createElement("div");
          dateDiv.classList.add("date");
          dateDiv.textContent = fmt.format(new Date(post.date));

          detailsDiv.appendChild(dateDiv);
          detailsDiv.appendChild(h2);

          const p = document.createElement("p");
          p.textContent = post.description;

          infoDiv.appendChild(detailsDiv);
          infoDiv.appendChild(p);

          postDiv.appendChild(infoDiv);

          postsDiv.appendChild(postDiv);
        }
      }
    </script>
  </head>
  <body>
    <main>
      <header>
        <div class="left">
          <h1>Dipam's Notebook</h1>
          <p>stuff about programming, math and more</p>
        </div>
      </header>

      <hr />

      <div class="posts"></div>
    </main>

    <footer>
      <div class="contain">
        <a href="https://github.com/dipamsen">

            >@dipamsen
            <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor">

              />

        <p style="color: #545454">

  </body>
</html>
